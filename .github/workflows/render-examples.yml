name: render-examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QUARTO_VERSION: "1.7.32"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Quarto directly from the GitHub release tarball rather
      # than through quarto-dev/quarto-actions@v2. The action's
      # archive download from codeload occasionally returns "An action
      # could not be found at the URI" with no retries on
      # ubuntu-24.04 runners (request id 4800:16E4B4:..., across
      # multiple regions). Direct install is more reliable.
      - name: Install Quarto
        run: |
          curl -fsSL -o /tmp/quarto.deb \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${{ env.QUARTO_VERSION }}/quarto-${{ env.QUARTO_VERSION }}-linux-amd64.deb"
          sudo dpkg -i /tmp/quarto.deb
          quarto --version

      # Install the Atkinson Hyperlegible Next + Mono TTFs at the
      # system font level so Typst's font resolver picks them up
      # alongside the bundled font-paths.
      - name: Install bundled TTFs
        run: |
          mkdir -p ~/.local/share/fonts
          cp _extensions/pequod/fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f -v
          fc-list | grep -i "Atkinson" || true

      - name: Render reveal (light)
        run: quarto render example.qmd

      - name: Render reveal (dark)
        run: quarto render example-dark.qmd

      - name: Render html
        run: quarto render example-html.qmd

      - name: Render typst PDF
        run: quarto render example-typst.qmd

      - name: Sanity-check outputs exist
        run: |
          test -f example.html
          test -f example-dark.html
          test -f example-html.html
          test -f example-typst.pdf

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-examples
          path: |
            example.html
            example-dark.html
            example-html.html
            example-typst.pdf
            example_files/
            example-dark_files/
            example-html_files/
          if-no-files-found: warn
