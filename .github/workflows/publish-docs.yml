name: publish-docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "_extensions/**"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

env:
  QUARTO_VERSION: "1.7.32"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        run: |
          curl -fsSL -o /tmp/quarto.deb \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${{ env.QUARTO_VERSION }}/quarto-${{ env.QUARTO_VERSION }}-linux-amd64.deb"
          sudo dpkg -i /tmp/quarto.deb
          quarto --version

      # Same TTF install as render-examples so the documentation site
      # renders with the institutional typography in CI.
      - name: Install bundled TTFs
        run: |
          mkdir -p ~/.local/share/fonts
          cp _extensions/pequod/fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f -v

      - name: Render docs
        working-directory: docs
        run: quarto render

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          publish_branch: gh-pages
          force_orphan: true
