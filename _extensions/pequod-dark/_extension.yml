title: Pequod (dark)
author: Tiago Jacinto
version: 0.3.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    common:
      # Shared logo-forwarding + OG/Twitter meta filter. Lives in the
      # sibling pequod/ ext dir; both extensions consume it via the
      # relative path so the file ships once.
      filters:
        - ../pequod/pequod.lua
    revealjs:
      theme: pequod-dark.scss
      highlight-style: pequod-dark.theme
      center: true
      slide-number: c/t
      width: 1600
      height: 900
      mainfont: "Atkinson Hyperlegible Next"
      monofont: "Atkinson Hyperlegible Mono"
