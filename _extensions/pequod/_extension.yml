title: Pequod
author: Tiago Jacinto
version: 0.2.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: pequod.scss
      highlight-style: pequod.theme
      center: true
      slide-number: c/t
      width: 1600
      height: 900
      mainfont: "Atkinson Hyperlegible Next"
      monofont: "Atkinson Hyperlegible Mono"
    html:
      theme: pequod-html.scss
      highlight-style: pequod.theme
      mainfont: "Atkinson Hyperlegible Next"
      monofont: "Atkinson Hyperlegible Mono"
